name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.9"

jobs:
  lint:
    name: lint + audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: "3.13"
      - name: Install (locked)
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          pip install "uv==${UV_VERSION}"
          uv sync --locked --extra dev
      - name: ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: zizmor (workflow security audit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.33.1 --format github .
      - name: pip-audit (known-vulnerable dependencies)
        run: |
          uv export --locked --all-extras --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (locked)
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          pip install "uv==${UV_VERSION}"
          uv sync --locked --extra dev
      - run: uv run --no-sync pytest -q
