version: 2
updates:
  # Keeps the SHA-pinned actions current (bumps the SHA and the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # Keeps uv.lock current. Security updates still arrive immediately when Dependabot alerts are on.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    cooldown:
      default-days: 7
