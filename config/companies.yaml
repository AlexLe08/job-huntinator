# Company list. One entry per job board.
#   company: display name          ats: greenhouse | lever | ashby | workable | recruitee | smartrecruiters | workday
#   token:   board slug in the ATS URL, e.g. boards.greenhouse.io/<token>, jobs.lever.co/<token>, jobs.ashbyhq.com/<token>,
#            apply.workable.com/<token>, <token>.recruitee.com, jobs.smartrecruiters.com/<token>
#   workday: token = tenant, plus host + site from the careers URL https://<host>/<site>  (e.g. redhat.wd5.myworkdayjobs.com / jobs)
#   tier:    frontend-product | boston | rtp | remote-first   (free-form; shows up in the sheet)
#   disabled: true  -> skipped by the scraper (dead token, or source not supported yet)
#   no_autodetect: true -> validator never suggests a replacement board (use after rejecting a wrong guess)
# Run `python -m jobscraper validate-companies` after editing; `--fix` applies auto-corrections.
